    # codememory.<domain> — step 2 of 2: TLS, proxied to the memory container published on the docker bridge
    # gateway (deploy/tencent/docker-compose.yml). host.docker.internal is mapped to host-gateway in the
    # nginx service of the Azora compose file.
    server {
        listen 443 ssl http2;
        server_name codememory.azorashopping.site;
        ssl_certificate /etc/letsencrypt/live/codememory.azorashopping.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/codememory.azorashopping.site/privkey.pem;
        client_max_body_size 200m;          # one Add may carry a whole session trajectory
        location / {
            proxy_pass http://host.docker.internal:8200;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 1800;        # the platform allows 30 minutes per request
            proxy_send_timeout 1800;
            proxy_request_buffering off;
        }
    }
