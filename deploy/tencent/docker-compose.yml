# Coding-track stack on a box whose ports 80/443 belong to another nginx container (the Azora stack):
# only the memory service, published on the docker bridge gateway (BIND_IP, default 172.17.0.1) so that
# nginx container reaches it as host.docker.internal:8200 while the internet cannot. TLS and the hostname
# live in that nginx (deploy/tencent/README.md).
#   cp .env.example .env   # set MEMORY_API_KEY
#   docker compose -p codememory -f deploy/tencent/docker-compose.yml --env-file .env up -d --build
services:
  memory:
    build:
      context: ../..
    env_file: ../../.env
    ports:
      - "${BIND_IP:-172.17.0.1}:8200:8000"
    volumes:
      - codememory-data:/data
    restart: unless-stopped
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
volumes:
  codememory-data:
