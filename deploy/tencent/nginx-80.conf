    # codememory.<domain> — AML coding-track memory service (compose project "codememory", deploy/tencent).
    # Step 1 of 2: HTTP only, so certbot can answer the challenge; the 443 block follows once the certificate exists.
    server {
        listen 80;
        server_name codememory.azorashopping.site;
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }
