[project]
name = "aml-memory"
version = "1.0.0"
description = "Agent Memory Leaderboard Add/Search service: raw chunks + SQLite FTS5 BM25 + standing-rule slots + temporal rendering"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "numpy>=2.5.3",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
